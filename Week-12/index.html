<!DOCTYPE html>
<html>
<head>
<title>SmartCart Manager</title>

<style>

body{
    font-family: Arial;
    background:#eef2ff;
    text-align:center;
}

/* CONTAINER */
.container{
    width:80%;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

h1{
    color:#4f46e5;
}

/* INPUTS */
input{
    margin:6px;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

/* BUTTONS */
button{
    padding:10px 14px;
    margin:5px;
    border:none;
    border-radius:6px;
    background:#4f46e5;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#3730a3;
}

/* TABLE */
table{
    margin:20px auto;
    border-collapse:collapse;
    width:100%;
}

th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

th{
    background:#4f46e5;
    color:white;
}

/* TOTAL */
#total{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
    color:#111;
}

.empty{
    color:gray;
}

</style>
</head>

<body>

<div class="container">

<h1>🛒 SmartCart Manager</h1>

<div>
<input type="number" id="id" placeholder="Item ID">
<input type="text" id="name" placeholder="Item Name">
<input type="number" id="price" placeholder="Price">
<input type="number" id="quantity" placeholder="Quantity">

<br>

<button onclick="addItem('start')">Add First</button>
<button onclick="addItem('end')">Add Last</button>
<button onclick="clearInputs()">Clear</button>
</div>

<br>

<div>
<input type="number" id="deleteId" placeholder="Delete by ID">
<button onclick="deleteItem()">Delete</button>
<button onclick="displayCart()">Refresh</button>
</div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Price</th>
<th>Qty</th>
<th>Total</th>
</tr>
</thead>

<tbody id="cartTable"></tbody>
</table>

<h2 id="total">Total: ₹0</h2>

</div>

<script>

let cart = [];

/* GET INPUT */
function getInput(){
let id = document.getElementById("id").value;
let name = document.getElementById("name").value;
let price = parseFloat(document.getElementById("price").value);
let quantity = parseInt(document.getElementById("quantity").value);

if(!id || !name || isNaN(price) || isNaN(quantity)){
alert("Please fill all fields properly!");
return null;
}

return {id,name,price,quantity};
}

/* ADD ITEM */
function addItem(position){

let item = getInput();
if(!item) return;

let existing = cart.find(i => i.id == item.id);

if(existing){
existing.quantity += item.quantity;
alert("Item already exists! Quantity updated.");
}else{
if(position === "start") cart.unshift(item);
else cart.push(item);
}

clearInputs();
displayCart();
}

/* DELETE */
function deleteItem(){

let id = document.getElementById("deleteId").value;

let index = cart.findIndex(i => i.id == id);

if(index === -1){
alert("Item not found!");
return;
}

cart.splice(index,1);
displayCart();
}

/* DISPLAY */
function displayCart(){

let table = document.getElementById("cartTable");
table.innerHTML="";

if(cart.length===0){
table.innerHTML="<tr><td colspan='5' class='empty'>Cart is empty</td></tr>";
updateTotal();
return;
}

cart.forEach(item=>{
let row=document.createElement("tr");

row.innerHTML=`
<td>${item.id}</td>
<td>${item.name}</td>
<td>₹${item.price}</td>
<td>${item.quantity}</td>
<td>₹${item.price * item.quantity}</td>
`;

table.appendChild(row);
});

updateTotal();
}

/* TOTAL */
function updateTotal(){

let total=0;

cart.forEach(item=>{
total += item.price * item.quantity;
});

document.getElementById("total").innerText="Total: ₹"+total;
}

/* CLEAR */
function clearInputs(){
document.getElementById("id").value="";
document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("quantity").value="";
}

</script>

</body>
</html>
