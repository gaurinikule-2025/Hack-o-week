<!DOCTYPE html>
<html>
<head>
    <title>Web Navigator Simulator</title>

    <style>
        body {
            font-family: Arial;
            background: #020617;
            color: #e2e8f0;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
            color: #38bdf8;
        }

        .container {
            width: 420px;
            margin: auto;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        input {
            padding: 10px;
            width: 85%;
            margin-bottom: 10px;
            border-radius: 6px;
            border: none;
            outline: none;
        }

        button {
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .visit { background: #22c55e; color:white; }
        .back { background: #3b82f6; color:white; }
        .forward { background: #f59e0b; color:white; }

        button:hover {
            opacity: 0.85;
        }

        .history {
            margin-top: 20px;
            text-align: left;
        }

        .box {
            background: #334155;
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<h1>🌐 Web Navigation Simulator</h1>

<div class="container">
    <input type="text" id="url" placeholder="Enter website URL">

    <br>
    <button class="visit" onclick="visitPage()">Visit Site</button>
    <button class="back" onclick="goBack()">⬅ Back</button>
    <button class="forward" onclick="goForward()">Forward ➡</button>

    <h3>Current Page:</h3>
    <div id="current" class="box">None</div>

    <div class="history">
        <h3>Back History</h3>
        <div id="backStack"></div>

        <h3>Forward History</h3>
        <div id="forwardStack"></div>
    </div>
</div>

<script>
    let backStack = [];
    let forwardStack = [];
    let currentPage = null;

    function visitPage() {
        let url = document.getElementById("url").value;

        if (!url) {
            alert("⚠ Please enter a valid URL");
            return;
        }

        if (!url.startsWith("http")) {
            url = "https://" + url;
        }

        if (currentPage) {
            backStack.push(currentPage);
        }

        currentPage = url;
        forwardStack = [];

        window.open(url, "_blank");

        document.getElementById("url").value = ""; // ✅ new change

        updateUI();
    }

    function goBack() {
        if (backStack.length === 0) {
            alert("No previous page available");
            return;
        }

        forwardStack.push(currentPage);
        currentPage = backStack.pop();

        updateUI();
    }

    function goForward() {
        if (forwardStack.length === 0) {
            alert("No next page available");
            return;
        }

        backStack.push(currentPage);
        currentPage = forwardStack.pop();

        updateUI();
    }

    function updateUI() {
        document.getElementById("current").innerText = currentPage || "None";

        document.getElementById("backStack").innerHTML =
            backStack.slice().reverse().map(p => `<div class="box">${p}</div>`).join("");

        document.getElementById("forwardStack").innerHTML =
            forwardStack.slice().reverse().map(p => `<div class="box">${p}</div>`).join("");
    }
</script>

</body>
</html>
