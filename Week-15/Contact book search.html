<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Contact Manager</title>

<style>
    body {
        font-family: Arial;
        text-align: center;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #5f9cff, #6a11cb);
        color: white;
    }

    h1 {
        margin-top: 20px;
    }

    .container {
        margin: 20px auto;
        padding: 20px;
        width: 60%;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 15px;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    input {
        padding: 10px;
        margin: 5px;
        width: 200px;
        border: none;
        border-radius: 8px;
        outline: none;
    }

    button {
        padding: 10px;
        margin: 5px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #00c9a7;
        color: white;
        font-weight: bold;
        transition: 0.3s;
    }

    button:hover {
        background: #00a387;
        transform: scale(1.05);
    }

    table {
        margin: 20px auto;
        border-collapse: collapse;
        width: 70%;
        background: white;
        color: black;
        border-radius: 10px;
        overflow: hidden;
    }

    th {
        background: #222;
        color: white;
    }

    th, td {
        padding: 10px;
        border: 1px solid #ddd;
    }
</style>
</head>

<body>

<h1>📒 Smart Contact Manager</h1>

<div class="container">
    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="phone" placeholder="Phone Number">
    <input type="email" id="email" placeholder="Email Address">

    <div>
        <button onclick="addContact()">Add</button>
        <button onclick="displayContacts()">View</button>
        <button onclick="sortContacts()">Sort</button>
        <button onclick="searchContact()">Search</button>
        <button onclick="updateContact()">Edit</button>
        <button onclick="deleteContact()">Remove</button>
    </div>
</div>

<h2>Contact List</h2>
<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody id="contactTable"></tbody>
</table>

<script>
let contacts = [];
const MAX = 100;

// Add Contact
function addContact() {
    if (contacts.length >= MAX) {
        alert("⚠ Contact list is full!");
        return;
    }

    let name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let email = document.getElementById("email").value.trim();

    if (!name || !phone || !email) {
        alert("⚠ Please fill all fields");
        return;
    }

    contacts.push({ name, phone, email });

    alert("✅ Contact added successfully!");
    clearInputs();
    displayContacts(); // ✅ auto update
}

// Display Contacts
function displayContacts() {
    let table = document.getElementById("contactTable");
    table.innerHTML = "";

    if (contacts.length === 0) {
        table.innerHTML = "<tr><td colspan='3'>No contacts available</td></tr>";
        return;
    }

    contacts.forEach(c => {
        table.innerHTML += `
        <tr>
            <td>${c.name}</td>
            <td>${c.phone}</td>
            <td>${c.email}</td>
        </tr>`;
    });
}

// Sort
function sortContacts() {
    contacts.sort((a, b) => a.name.localeCompare(b.name));
    alert("📌 Contacts sorted by name");
    displayContacts();
}

// Binary Search
function binarySearch(name) {
    let low = 0, high = contacts.length - 1;

    while (low <= high) {
        let mid = Math.floor((low + high) / 2);
        let midName = contacts[mid].name.toLowerCase();

        if (midName === name.toLowerCase()) return mid;
        else if (midName < name.toLowerCase()) low = mid + 1;
        else high = mid - 1;
    }
    return -1;
}

// Search
function searchContact() {
    if (contacts.length === 0) {
        alert("No contacts available");
        return;
    }

    let name = prompt("Enter name to search:");
    sortContacts();

    let index = binarySearch(name);

    if (index === -1) {
        alert("❌ Contact not found");
    } else {
        let c = contacts[index];
        alert(`✅ Found:\n${c.name}\n${c.phone}\n${c.email}`);
    }
}

// Update
function updateContact() {
    let name = prompt("Enter name to update:");
    let index = contacts.findIndex(c => c.name.toLowerCase() === name.toLowerCase());

    if (index === -1) {
        alert("❌ Contact not found");
        return;
    }

    contacts[index].phone = prompt("New phone:", contacts[index].phone);
    contacts[index].email = prompt("New email:", contacts[index].email);

    alert("✅ Contact updated");
    displayContacts();
}

// Delete
function deleteContact() {
    let name = prompt("Enter name to delete:");
    let index = contacts.findIndex(c => c.name.toLowerCase() === name.toLowerCase());

    if (index === -1) {
        alert("❌ Contact not found");
        return;
    }

    contacts.splice(index, 1);

    alert("🗑 Contact removed");
    displayContacts();
}

// Clear inputs
function clearInputs() {
    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("email").value = "";
}
</script>

</body>
</html>
